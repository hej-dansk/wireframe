<script>
/* Apply any saved theme (colors + fonts) immediately, before paint,
   so every page opens already re-themed — not just the one you
   changed it on. theme-panel.js keeps this in sync when you edit. */
(function () {
  try {
    var data = JSON.parse(localStorage.getItem("hejdansk-theme") || "null");
    if (!data) return;
    var root = document.documentElement.style;
    if (data.colors) for (var k in data.colors) root.setProperty(k, data.colors[k]);
    if (data.fonts && data.fonts.heading) root.setProperty("--font-display", '"' + data.fonts.heading + '", sans-serif');
    if (data.fonts && data.fonts.body) root.setProperty("--font-body", data.fonts.body === "System UI" ? "-apple-system, BlinkMacSystemFont, sans-serif" : '"' + data.fonts.body + '", sans-serif');
  } catch (e) {}
})();
</script>
